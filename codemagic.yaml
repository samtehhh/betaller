workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: BeTaller
    environment:
      flutter: stable
      xcode: latest
      # Signing comes from the team's code signing identities: the
      # distribution certificate uploaded there plus an App Store profile
      # for this bundle id. The old step created a certificate from
      # CERTIFICATE_PRIVATE_KEY; once that certificate was revoked, every
      # build failed, because the team already holds its three certificates.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.glowup.boyuzatmaApp.33JY92T594
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: com.glowup.boyuzatmaApp.33JY92T594
        APP_STORE_APP_ID: "6761445065"
    scripts:
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Pre-build iOS config
        script: flutter build ios --config-only
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Pick a build number App Store Connect has not seen
        script: |
          # App Store Connect rejects an upload whose build number was used
          # before, and it is easy to push a code change and forget to bump it.
          # Ask the store what the highest number is and go one past it.
          #
          # Deliberately non-fatal: if this lookup fails for any reason the
          # step says so and BUILD_NUMBER stays unset, and the build below
          # falls back to the number in pubspec.yaml — exactly what happened
          # before this step existed. It can slow a build down, never break it.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || true)
          if echo "$LATEST" | grep -Eq '^[0-9]+$'; then
            NEXT=$((LATEST + 1))
            echo "BUILD_NUMBER=$NEXT" >> "$CM_ENV"
            echo "Highest build on TestFlight is $LATEST — this one goes up as $NEXT."
          else
            echo "Could not read the latest build number (got: '$LATEST')."
            echo "Falling back to the version in pubspec.yaml."
          fi
      - name: Build IPA
        script: |
          # The developer switches — flip premium on, load the demo history —
          # unlock every paid screen with a tap, so a build that carries them
          # is a build that gives the subscription away. They ride along on a
          # feature branch, where the only audience is TestFlight, and are
          # left out of anything built from main. Ship from main.
          if [ "$CM_BRANCH" = "main" ]; then
            DEV_TOOLS=false
          else
            DEV_TOOLS=true
          fi
          echo "Building $CM_BRANCH with DEV_TOOLS=$DEV_TOOLS"

          # The export options come from `xcode-project use-profiles`, which
          # names the profile Codemagic installed. Left to itself, flutter
          # looks for profiles where Xcode 16+ keeps them, finds none, and
          # falls back to an ExportOptions.plist that cannot export.
          if [ -n "$BUILD_NUMBER" ]; then
            flutter build ipa --release \
              --build-number="$BUILD_NUMBER" \
              --export-options-plist=/Users/builder/export_options.plist \
              --dart-define=DEV_TOOLS=$DEV_TOOLS --verbose
          else
            flutter build ipa --release \
              --export-options-plist=/Users/builder/export_options.plist \
              --dart-define=DEV_TOOLS=$DEV_TOOLS --verbose
          fi

          # flutter exits 0 when only the export fails, and the build then
          # "finishes" with nothing to publish. No .ipa, no success.
          ls build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - samtehhh@gmail.com
