name: Build & distribute test APK

# Every push builds a release-mode APK, signed with a dedicated CI-only key
# (separate from the real Play Store upload key — see CI_KEYSTORE_BASE64 in
# repo secrets), and pushes it to Firebase App Distribution. Testers get a
# notification in the Firebase App Tester app and can install with one tap,
# from anywhere — no laptop, no cable.
on:
  push:
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: stable

      - name: Decode CI signing key
        run: |
          echo "${{ secrets.CI_KEYSTORE_BASE64 }}" | base64 --decode > android/app/ci-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.CI_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.CI_KEY_PASSWORD }}
          keyAlias=${{ secrets.CI_KEY_ALIAS }}
          storeFile=ci-release.jks
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Otomatik test build — commit ${{ github.sha }}"
