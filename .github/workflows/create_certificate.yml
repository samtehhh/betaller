name: Create iOS Distribution Certificate

on:
  workflow_dispatch:

jobs:
  create-cert:
    runs-on: macos-latest
    steps:
      - name: Create iOS Distribution Certificate
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          echo "$PRIVATE_KEY" > AuthKey.p8
          pip3 install pyjwt cryptography --break-system-packages
          
          python3 << 'PYTHON'
import jwt, time, subprocess, json, os, base64

key_id = os.environ['KEY_ID']
issuer_id = os.environ['ISSUER_ID']

with open('AuthKey.p8', 'r') as f:
    private_key = f.read()

token = jwt.encode(
    {"iss": issuer_id, "iat": int(time.time()), "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"},
    private_key,
    algorithm="ES256",
    headers={"kid": key_id}
)

# Generate distribution key and CSR
subprocess.run(["openssl", "genrsa", "-out", "dist.key", "2048"])
subprocess.run(["openssl", "req", "-new", "-key", "dist.key", "-out", "dist.csr", "-subj", "/CN=iOS Distribution"])

with open("dist.csr", "rb") as f:
    csr_content = base64.b64encode(f.read()).decode()

import urllib.request
data = json.dumps({"data": {"type": "certificates", "attributes": {"certificateType": "IOS_DISTRIBUTION", "csrContent": csr_content}}}).encode()
req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/certificates", data=data, headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
with urllib.request.urlopen(req) as r:
    print(r.read().decode())
PYTHON
